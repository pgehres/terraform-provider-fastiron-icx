version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Keeps the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same CodeQL version; bumping them in
      # separate PRs fails CodeQL ("Loaded a configuration file for version
      # X, but running version Y"). Keep them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
